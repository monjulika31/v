<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Quicksand&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #fcefee, #f8d7da, #f6c1d7);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.container {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
    padding: 45px;
    border-radius: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    max-width: 420px;
    position: relative;
    animation: float 4s ease-in-out infinite;
}

h1 {
    font-family: 'Playfair Display', serif;
    color: #a85c7a;
    font-size: 2.3rem;
}

p {
    color: #7b5d67;
    font-size: 1.1rem;
}

img {
    width: 240px;
    margin: 25px 0;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

button {
    padding: 12px 28px;
    font-size: 1rem;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 12px;
    transition: 0.3s;
    font-family: 'Quicksand', sans-serif;
}

.yes {
    background-color: #e88cae;
    color: white;
}

.yes:hover {
    background-color: #d96b93;
    transform: scale(1.1);
}

.no {
    background-color: #e3d5dc;
    position: absolute;
}

/* floating animation */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}
</style>
</head>

<body>

<div class="container">
    <h1>Dear Preettuu 💕</h1>
    <p>Like these little penguins…</p>
    <p>I want to hold your hand forever.</p>

    <img src="penguin.png" alt="Watercolor Penguins">

    <p>Will you be my Valentine? 💖</p>

    <button class="yes" onclick="yesClicked()">YES </button>
    <button class="no" onmouseover="moveButton()">No 🙈</button>
</div>

<script>
function yesClicked() {
    document.body.innerHTML = `
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:linear-gradient(135deg,#fcefee,#f8d7da,#f6c1d7); text-align:center;">
            <h1 style="font-family:'Playfair Display',serif; color:#ffffff; font-size:2.8rem;">
                You just made me the happiest girl 🥹💖<br><br>
                I love you so much Peettuuu ✨
            </h1>
        </div>
    `;
}

function moveButton() {
    const button = document.querySelector('.no');
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 80);

    button.style.left = x + "px";
    button.style.top = y + "px";
}
</script>

</body>
</html>
